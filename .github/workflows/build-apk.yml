name: Deploy Live WebView Page (GitHub Pages) & Build Dev APK

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      webview_url:
        description: 'Custom Live WebView URL (Leave empty to auto-use deployed GitHub Pages URL)'
        required: false
        default: ''
      build_type:
        description: 'Choose APK mode: dev-webview (points to Live WebView Page) or production-offline'
        required: false
        default: 'dev-webview'
        type: choice
        options:
          - dev-webview
          - production-offline
          - release-signed

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-and-apk'
  cancel-in-progress: false

jobs:
  # JOB 1: Build & Deploy the Live WebView Webpage to GitHub Pages
  deploy-webview-page:
    name: 1. Deploy Live WebView Webpage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      live_page_url: ${{ steps.page_info.outputs.url }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Dependencies & Build WebView Webpage
        env:
          VITE_TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          VITE_TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run build
          cp dist/index.html dist/404.html

      - name: Compute GitHub Pages Live WebView URL
        id: page_info
        run: |
          REPO_OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          PAGE_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/"
          echo "url=$PAGE_URL" >> $GITHUB_OUTPUT
          echo "🌐 Live WebView Webpage URL: $PAGE_URL"

      - name: Push Built Webpage to gh-pages Branch (Works Automatic on All Repos)
        run: |
          cd dist
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy TeleCall Live WebView Webpage"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Setup GitHub Pages Action
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Publish to GitHub Pages Environment
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

  # JOB 2: Build the Android Dev APK connected to the Live WebView Webpage URL
  build-apk:
    name: 2. Build TeleCall Dev APK (Linked to WebView URL)
    needs: deploy-webview-page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install Project & Capacitor Dependencies
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest @capacitor/status-bar@latest @capacitor/keyboard@latest --legacy-peer-deps --no-audit --no-fund

      - name: Build Web Application Assets
        env:
          VITE_TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          VITE_TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: npm run build

      - name: Configure Capacitor & Link Dev APK to Deployed WebView URL
        run: |
          MANUAL_URL="${{ github.event.inputs.webview_url }}"
          BUILD_MODE="${{ github.event.inputs.build_type || 'dev-webview' }}"
          REPO_OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)

          if [ -n "$MANUAL_URL" ]; then
            TARGET_URL="$MANUAL_URL"
          else
            TARGET_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/"
          fi

          if [ "$BUILD_MODE" = "dev-webview" ]; then
            echo "⚡ BUILDING TELECALL DEV APK pointing to Live WebView Webpage: $TARGET_URL"
            cat << EOF > capacitor.config.json
          {
            "appId": "com.telecall.dev",
            "appName": "TeleCall Dev",
            "webDir": "dist",
            "server": {
              "url": "$TARGET_URL",
              "cleartext": true,
              "errorPath": "index.html",
              "androidScheme": "https",
              "allowNavigation": ["*"]
            },
            "android": {
              "allowMixedContent": true,
              "captureInput": true,
              "webContentsDebuggingEnabled": true,
              "backgroundColor": "#0b141a"
            },
            "plugins": {
              "StatusBar": {
                "overlaysWebView": true,
                "style": "DARK",
                "backgroundColor": "#00000000"
              }
            }
          }
          EOF
            echo "ARTIFACT_NAME=telecall-dev-webview-apk" >> $GITHUB_ENV
            echo "APK_PREFIX=telecall-dev" >> $GITHUB_ENV
          else
            echo "📦 BUILDING TELECALL OFFLINE PRODUCTION APK"
            cat << EOF > capacitor.config.json
          {
            "appId": "com.telecall.app",
            "appName": "TeleCall",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": true,
              "backgroundColor": "#0b141a"
            }
          }
          EOF
            echo "ARTIFACT_NAME=telecall-production-apk" >> $GITHUB_ENV
            echo "APK_PREFIX=telecall-production" >> $GITHUB_ENV
          fi

      - name: Setup Android Platform & Permissions
        run: |
          if [ ! -d "android/app" ]; then
            npx cap add android
          fi
          npx cap sync android

          chmod +x android/gradlew || true

          # Inject Microphone & Audio Permissions for Calling & Voice Rooms
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "android.permission.RECORD_AUDIO" "$MANIFEST"; then
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.READ_CONTACTS" />' "$MANIFEST"
          fi

      - name: Build Android Dev APK
        if: "${{ github.event.inputs.build_type != 'release-signed' }}"
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          find android/app/build/outputs/apk/debug -name "*.apk" -exec cp {} android/app/build/outputs/apk/debug/${{ env.APK_PREFIX }}-debug.apk \;

      - name: Upload Dev APK Artifact
        if: "${{ github.event.inputs.build_type != 'release-signed' }}"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: android/app/build/outputs/apk/debug/${{ env.APK_PREFIX }}-debug.apk
          retention-days: 30
